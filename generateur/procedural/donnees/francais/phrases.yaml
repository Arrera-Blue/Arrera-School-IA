# Table de référence (générateur procédural du français, lot 1, étape 1.3), écrite par Claude avec
# scripts/phrase/construire_phrases.py, comparée à Lexique 3.83 (scripts/phrase/verifier_phrases.py).
# À relire par l'utilisateur : python -m generateur.procedural.tables relire francais/phrases --par "…"
description: 'Des phrases simples, courtes : leur type, si elles sont négatives ou exclamatives (des formes, pour le programme
  du cycle 2), si leur signe final est imposé par un mot, et la nature de chacun de leurs mots dans la phrase (« mots » :
  mot/nature, le signe final à part). Aucun prénom : les noms propres sont des villes ou des fleuves.'
sources:
  claude:
    nom: Phrases écrites par Claude ; la nature de chaque mot comparée aux catégories de Lexique 3.83
    url: http://www.lexique.org
    consulte: '2026-11-12'
    licence: CC BY-SA 4.0 (Lexique 3), pour la comparaison seulement
proprietes:
  phrase: texte
  mots: texte
  type:
  - declarative
  - interrogative
  - imperative
  negative:
  - oui
  - non
  exclamative:
  - oui
  - non
  signe_impose:
  - oui
  - non
  depuis:
  - CP
  - CE1
  - CE2
cle:
- phrase
