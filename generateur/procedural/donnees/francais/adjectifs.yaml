# Table de référence (générateur procédural du français, lot 1, étape 1.2), écrite par Claude avec
# scripts/accords/construire_accords.py, comparée à Lexique 3.83 (scripts/accords/verifier_accords.py).
# À relire par l'utilisateur : python -m generateur.procedural.tables relire francais/adjectifs --par "…"
description: Des adjectifs aux quatre formes toutes différentes ; leur place par rapport au nom ; les sortes de noms qu'ils
  qualifient (« tout », ou une liste).
sources:
  claude:
    nom: Liste écrite par Claude ; genres, pluriels et formes comparés à Lexique 3.83
    url: http://www.lexique.org
    consulte: '2026-11-11'
    licence: CC BY-SA 4.0 (Lexique 3), pour la comparaison seulement
