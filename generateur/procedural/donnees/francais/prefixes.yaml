# Table de référence (générateur procédural du français, lot 1, étape 1.4), écrite par Claude avec
# scripts/vocabulaire/construire_vocabulaire.py, comparée à Lexique 3.83 (scripts/vocabulaire/verifier_vocabulaire.py).
# À relire par l'utilisateur : python -m generateur.procedural.tables relire francais/prefixes --par "…"
description: Des mots et le préfixe qui fait leur contraire ; les préfixes pièges ne font aucun vrai mot (Lexique 3.83).
sources:
  claude:
    nom: Listes écrites par Claude ; mots, classes et pièges comparés à Lexique 3.83
    url: http://www.lexique.org
    consulte: '2026-11-12'
    licence: CC BY-SA 4.0 (Lexique 3), pour la comparaison seulement
