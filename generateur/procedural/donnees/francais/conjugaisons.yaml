# Table de référence (générateur procédural du français, lot 1, étape 1.1), écrite par Claude avec
# scripts/conjugaison/construire_conjugaisons.py, chaque forme comparée à Verbiste.
# À relire par l'utilisateur : python -m generateur.procedural.tables relire francais/conjugaisons --par "…"
description: 'Les formes conjuguées des verbes du programme du cycle 2, à l''indicatif (présent, imparfait, futur, passé composé),
  sans le pronom. « depuis » : la première classe où la ligne sert (CP : être et avoir au présent ; CE1 : 4 temps, être, avoir,
  verbes en -er ; CE2 : faire, aller, dire, venir, pouvoir, voir, vouloir, prendre). Au passé composé avec être, seulement
  il et ils.'
sources:
  verbiste:
    nom: 'Verbiste (par verbecc 2.1.0) : chaque forme comparée, identique'
    url: https://github.com/bretttolbert/verbecc
    consulte: '2026-11-11'
    licence: LGPL (données de Verbiste) ; seules des formes de la langue sont reprises
proprietes:
  infinitif: texte
  groupe:
  - aux
  - '1'
  - '3'
  temps:
  - present
  - imparfait
  - futur
  - passe_compose
  personne:
  - je
  - tu
  - il
  - nous
  - vous
  - ils
  forme: texte
  depuis:
