# À relire par l'utilisateur : python -m generateur.procedural.tables relire francais/lettres_muettes --par "…"
description: Un mot, sa lettre muette finale, le mot de la famille qui la fait entendre ; les lettres pièges ne font aucun
  vrai mot (Lexique 3.83).
