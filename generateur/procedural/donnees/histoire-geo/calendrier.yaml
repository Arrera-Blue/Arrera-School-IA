# Table de référence (générateur procédural de l'histoire, lot 2, étape 2.1), écrite par Claude ; chaque ligne cite sa
# source (docs/Generateur-Procedural/lot-2-questionner-le-monde.md §4). Le générateur ne demande jamais « le premier
# jour de la semaine » (le lundi pour la norme ISO 8601, le dimanche ailleurs : un fait discuté), seulement le jour
# juste avant ou juste après ; ni le nombre de saisons (4 en zone tempérée, saison sèche et saison des pluies sous les
# tropiques), seulement leur ordre.
# À relire par l'utilisateur : python -m generateur.procedural.tables relire histoire-geo/calendrier --par "…"
description: Les jours de la semaine, les mois de l'année et les quatre saisons, chacun dans son ordre.
sources:
  programme:
    nom: Programme d’histoire-géographie du cycle 2, CP, thèmes 1 et 2 (annexe 3, BO n° 22 du 28 mai 2026)
    url: https://www.education.gouv.fr/sites/default/files/document/annexe-3-programme-d-histoire-geographie-cycle-2-516776.pdf
    consulte: '2026-11-16'
  wp_semaine:
    nom: Wikipédia, « Semaine » (« Les jours de la semaine sont les lundi, mardi, mercredi, jeudi, vendredi, samedi et dimanche. »)
    url: https://fr.wikipedia.org/wiki/Semaine
    consulte: '2026-11-16'
    licence: CC BY-SA 4.0
  wp_calendrier:
    nom: Wikipédia, « Calendrier grégorien », section « Subdivisions » (les douze mois, dans l’ordre)
    url: https://fr.wikipedia.org/wiki/Calendrier_gr%C3%A9gorien
    consulte: '2026-11-16'
    licence: CC BY-SA 4.0
  wp_saison:
    nom: Wikipédia, « Saison » (« printemps, été, automne et hiver »)
    url: https://fr.wikipedia.org/wiki/Saison
    consulte: '2026-11-16'
    licence: CC BY-SA 4.0
