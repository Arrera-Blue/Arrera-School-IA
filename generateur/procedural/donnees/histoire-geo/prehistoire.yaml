# Table de référence (générateur procédural de l'histoire, lot 2, étape 2.1), écrite par Claude ; chaque ligne cite sa
# source (docs/Generateur-Procedural/lot-2-questionner-le-monde.md §4). Écartés, parce que discutés : la poterie (des
# poteries plus anciennes que le Néolithique existent en Asie de l'Est) et les premiers villages (déjà avant le
# Néolithique au Proche-Orient). Une « nouveauté » du Néolithique n'existait pas au Paléolithique ; une « activité » du
# Paléolithique existait déjà : l'une n'est jamais la bonne réponse d'une question sur l'autre. `apparait` : oui quand
# « À quelle période apparaît… ? » a une seule réponse (pas pour la chasse ou la cueillette, plus anciennes que le
# Paléolithique des manuels ; pas pour un mode de vie).
# À relire par l'utilisateur : python -m generateur.procedural.tables relire histoire-geo/prehistoire --par "…"
description: Le mode de vie au Paléolithique et au Néolithique ; ce qui existait déjà, ce qui apparaît.
