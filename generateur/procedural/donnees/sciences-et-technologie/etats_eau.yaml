# Table de référence (générateur procédural de la matière et des objets, lot 2, étape 2.3), écrite par Claude ; chaque
# ligne cite sa source, lue le 18/11 (docs/Generateur-Procedural/lot-2-questionner-le-monde.md §8). Les phénomènes
# naturels sont ceux du programme du CP. Écartés (§3) : le nuage et le brouillard (« des gouttelettes […] (parfois de
# cristaux de glace) ») ; la cascade (aucune page lue ne dit l'état de son eau ; une cascade gèle en hiver). Nuances :
# la neige est parfois mêlée d'eau liquide près de 0 °C ; la pluie, parfois de grêlons (« Pluie »).
# À relire par l'utilisateur : python -m generateur.procedural.tables relire sciences-et-technologie/etats_eau --par "…"
description: L'état de l'eau, solide ou liquide, dans des phénomènes naturels.
sources:
  programme: {nom: "Programme de sciences et technologie du cycle 2, CP (BO n° 24 du 11 juin 2026) : « L’élève identifie l’état physique de l’eau (solide ou liquide) dans le contexte des phénomènes naturels (cours d’eau, mer, océan, cascade, pluie, nuage, brouillard, grêle, neige, glace, banquise, glacier). »", url: "https://www.education.gouv.fr/sites/default/files/document/bulletin-officiel-ndeg-24-du-11-juin-2026-519026.pdf", consulte: '2026-11-18'}
  wp_grele: {nom: "Wikipédia, « Grêle » (« Elle est constituée de billes disjointes de glace (grêlons) »)", url: "https://fr.wikipedia.org/wiki/Gr%C3%AAle", consulte: '2026-11-18', licence: CC BY-SA 4.0}
  wp_neige: {nom: "Wikipédia, « Neige » (« constituée de particules de glace ramifiées »)", url: "https://fr.wikipedia.org/wiki/Neige", consulte: '2026-11-18', licence: CC BY-SA 4.0}
  wp_glace: {nom: "Wikipédia, « Glace » (« La glace est l'eau (de formule chimique H2O) lorsqu'elle est à l'état solide. »)", url: "https://fr.wikipedia.org/wiki/Glace", consulte: '2026-11-18', licence: CC BY-SA 4.0}
  wp_banquise: {nom: "Wikipédia, « Banquise » (« La banquise est l'étendue de glace qui se forme à la surface d'une étendue d'eau par solidification des couches supérieures d'eau, généralement en mer »)", url: "https://fr.wikipedia.org/wiki/Banquise", consulte: '2026-11-18', licence: CC BY-SA 4.0}
  wp_glacier: {nom: "Wikipédia, « Glacier » (« Un glacier est une masse de glace plus ou moins étendue »)", url: "https://fr.wikipedia.org/wiki/Glacier", consulte: '2026-11-18', licence: CC BY-SA 4.0}
  wp_pluie: {nom: "Wikipédia, « Pluie » (« des gouttes d'eau tombent des nuages vers le sol »)", url: "https://fr.wikipedia.org/wiki/Pluie", consulte: '2026-11-18', licence: CC BY-SA 4.0}
  wp_eau: {nom: "Wikipédia, « Eau » (« L'eau liquide est trouvée dans toutes sortes d'étendues d'eau, telles que les océans, les mers, les lacs, et de cours d'eau tels que les fleuves, les rivières »)", url: "https://fr.wikipedia.org/wiki/Eau", consulte: '2026-11-18', licence: CC BY-SA 4.0}
proprietes:
  nom: texte
  etat: [solide, liquide]
cle: [nom]
