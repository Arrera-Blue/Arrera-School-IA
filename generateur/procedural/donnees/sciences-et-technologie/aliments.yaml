# Table de référence (générateur procédural du corps humain, lot 2, étape 2.3), écrite par Claude ; chaque ligne cite
# sa source, lue le 18/11 (docs/Generateur-Procedural/lot-2-questionner-le-monde.md §7). Les 6 catégories et les 4
# origines sont celles du programme du CP. Monde fermé : chaque aliment a une catégorie, une origine, et dit s'il est
# un produit transformé ; « - » : jamais demandé, ni proposé comme mauvaise réponse pour cette propriété.
# Écartés (un aliment à deux catégories, §3) : la pomme de terre et la banane (des féculents pour Wikipédia), le beurre
# (matière grasse et produit laitier), le lait (produit laitier et boisson : seulement son origine), les petits pois,
# les légumes secs, le maïs. `origine` : « - » pour un aliment fait de plusieurs produits (le pain : de la farine, de
# l'eau, du sel) ou à plusieurs origines possibles (l'huile, la margarine). `transforme` : « oui » pour un aliment
# fabriqué à partir d'autres produits, « non » pour un aliment qu'on mange tel qu'on le récolte ou le ramasse, « - »
# sinon (le riz est décortiqué, le poulet et le poisson sont découpés).
# À relire par l'utilisateur : python -m generateur.procedural.tables relire sciences-et-technologie/aliments --par "…"
description: Des aliments, leur catégorie, leur origine, et s'ils sont des produits transformés.
