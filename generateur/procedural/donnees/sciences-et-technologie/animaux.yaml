# Table de référence (générateur procédural du vivant, lot 2, étape 2.2), écrite par Claude ; chaque ligne cite la page
# Wikipédia de l'animal, lue le 16/11 (docs/Generateur-Procedural/lot-2-questionner-le-monde.md §6). Monde fermé :
# chaque animal a un groupe et un régime. `regime` : « - » quand il n'est jamais demandé, parce que discuté ou
# variable (l'araignée : une espèce est herbivore ; l'escargot : « la plupart » sont phytophages ; la baleine, la
# tortue, la grenouille, l'abeille, la fourmi, la chauve-souris : selon l'espèce ou l'âge). `confusion` : le groupe où
# les élèves rangent souvent l'animal à tort (le dauphin « poisson »), proposé d'abord comme mauvaise réponse ; « - » :
# aucune.
# À relire par l'utilisateur : python -m generateur.procedural.tables relire sciences-et-technologie/animaux --par "…"
description: Des animaux, leur groupe dans la classification et leur régime alimentaire.
