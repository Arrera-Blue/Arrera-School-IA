# Référentiel des attendus — anglais, CP (générateur procédural du cycle 2, lot 3, étape 3.0). Libellés recopiés
# MOT POUR MOT des « Attendus de fin d’année » et de la colonne « Objectifs d’apprentissage » du programme officiel de
# 2026 (source ci-dessous ; le PDF du BO, pages 14 à 47 :
# https://www.education.gouv.fr/sites/default/files/document/Bulletin%20officiel%20n%C2%B0%2012%20du%2019%20mars%202026-481193.pdf).
# Le programme vaut pour toutes les langues vivantes ; ses marques de niveau, « (A1) » et « (pré-A1) », sont gardées
# dans les libellés. Seuls les identifiants, le code de la compétence (« code »), le champ « qcm » (se prête ou non à
# un QCM : classement du projet, pas du programme), la colonne d’origine (« colonne ») et le niveau du CECRL
# (« niveau_cecrl », lu dans la couleur du texte : bleu pour le A1) sont ajoutés. Méthode et corrections :
# docs/Generateur-Procedural/lot-3-anglais.md §11.1.
matiere: anglais
niveau: CP
cycle: 2
source:
  texte: Programme de langues vivantes étrangères et régionales pour le cycle 2 (annexe 1 de l’arrêté)
  arrete: Arrêté du 26 février 2026 (JO du 7 mars 2026)
  nor: MENE2602911A
  bo: BO n° 12 du 19 mars 2026
  url: https://www.education.gouv.fr/bo/2026/Hebdo12/MENE2602911A
  en_vigueur: au CP depuis la rentrée 2026-2027 (article 3 de l’arrêté)
  extrait: Programme de langues vivantes étrangères et régionales pour le cycle 2 (annexe 1), « Cours préparatoire »
  releve: '2026-11-25'
themes:
- id: anglais.cp.mots-familiers
  domaine: 'Compréhension de l’oral : écouter et comprendre'
  theme: Comprendre quelques mots familiers et expressions très courantes
  code: CO-CP
  attendus:
  - id: anglais.cp.mots-familiers.01
    libelle: l’élève peut reconnaitre des consignes, des jours de la semaine, des dates, des nombres connus, des prix, à condition
      qu’ils soient prononcés clairement et lentement dans un contexte bien défini, quotidien et familier ;
    qcm: true
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.mots-familiers.02
    libelle: il peut repérer des mots simples ou des expressions toutes faites, à condition qu’ils soient prononcés en face-à-face,
      accompagnés de visuels ou de gestes et éventuellement répétés.
    qcm: true
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.mots-familiers.03
    libelle: Repérer quelques mots du champ lexical de la prise de contact ou des salutations
    qcm: true
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.mots-familiers.04
    libelle: Reconnaitre les pronoms interrogatifs usuels
    qcm: true
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.mots-familiers.05
    libelle: Reconnaitre les pronoms personnels sujets (je, tu), compléments (moi, toi) et les déterminants possessifs (mon,
      ton) accompagnés de gestes.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.mots-familiers.06
    libelle: Identifier les verbes permettant d’exprimer le gout et le dégout, ainsi que quelques adjectifs accompagnés de
      gestes, expressions du visage ou d’un support visuel.
    qcm: true
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.mots-familiers.07
    libelle: Identifier l’humeur de ses interlocuteurs (tristesse, joie, colère) en s’aidant de l’émotion portée par la voix,
      les gestes et les expressions du visage.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.mots-familiers.08
    libelle: Repérer les mots simples et familiers accompagnés de visuels (famille et environnement immédiat).
    qcm: true
    colonne: objectifs
    niveau_cecrl: pré-A1
- id: anglais.cp.suivre-histoire
  domaine: 'Compréhension de l’oral : écouter et comprendre'
  theme: Suivre le fil d’une histoire adaptée à l’âge des élèves et suffisamment étayée
  code: CO-CP
  attendus:
  - id: anglais.cp.suivre-histoire.01
    libelle: l’élève peut reconnaitre des mots courants, à condition qu’ils soient prononcés lentement dans un contexte clairement
      défini, quotidien et familier (comptines, courtes chansons, albums de littérature jeunesse, saynètes) ;
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.suivre-histoire.02
    libelle: il peut identifier des mots, des noms et des chiffres connus, dans des énoncés ou des enregistrements courts
      et simples, à condition que la prononciation soit lente et claire ;
    qcm: true
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.suivre-histoire.03
    libelle: il peut associer un document oral à un document visuel parmi deux propositions très contrastées.
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.suivre-histoire.04
    libelle: Reconnaitre certaines lettres de l’alphabet et les chiffres.
    qcm: true
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.suivre-histoire.05
    libelle: Reconnaitre des mots simples en s’appuyant sur les indices visuels (affiches, images, animations visuelles) et
      sonores (onomatopées, bruitages, musiques).
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.suivre-histoire.06
    libelle: Reconnaitre les mots familiers pour parler de soi, de sa sphère immédiate et des thématiques culturelles et disciplinaires
      travaillées en classe.
    qcm: true
    colonne: objectifs
    niveau_cecrl: pré-A1
- id: anglais.cp.comprendre-agir
  domaine: 'Compréhension de l’oral : écouter et comprendre'
  theme: Comprendre et agir
  code: CO-CP
  attendus:
  - id: anglais.cp.comprendre-agir.01
    libelle: l’élève peut montrer sa compréhension par une action ou une gestuelle adaptée.
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.comprendre-agir.02
    libelle: Reconnaitre quelques formes courantes de l’impératif afin de réagir à des consignes et instructions simples accompagnées
      de gestes ou de supports visuels (consignes de la classe, instructions de jeu ou étapes d’une recette, etc.).
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.comprendre-agir.03
    libelle: Agir en suivant les indications données par des verbes d’action qui peuvent être associés à des prépositions
      permettant de se repérer dans l’espace.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
- id: anglais.cp.reperes-phonologiques
  domaine: 'Expression orale en continu : parler en continu'
  theme: Repères phonologiques
  code: EOC-CP
  attendus:
  - id: anglais.cp.reperes-phonologiques.01
    libelle: l’élève peut prononcer un répertoire de quelques mots et expressions mémorisés de manière compréhensible.
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.reperes-phonologiques.02
    libelle: Réaliser les spécificités phonologiques essentielles de la langue apprise.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.reperes-phonologiques.03
    libelle: Prononcer correctement des mots isolés et mémorisés dans plusieurs champs lexicaux connus en respectant l’accentuation
      des mots selon le modèle phonétique de la langue.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
- id: anglais.cp.reproduire-modele
  domaine: 'Expression orale en continu : parler en continu'
  theme: Reproduire un modèle oral
  code: EOC-CP
  attendus:
  - id: anglais.cp.reproduire-modele.01
    libelle: l’élève peut reproduire un modèle oral court ;
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.reproduire-modele.02
    libelle: il peut décrire très brièvement des personnes, des objets ou des animaux familiers en utilisant des modèles mémorisés.
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.reproduire-modele.03
    libelle: Parler de soi ou de son environnement familier en s’appuyant sur des supports visuels et en prononçant correctement
      des formules brèves, ritualisées et mémorisées.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
- id: anglais.cp.raconter
  domaine: 'Expression orale en continu : parler en continu'
  theme: Raconter
  code: EOC-CP
  attendus:
  - id: anglais.cp.raconter.01
    libelle: l’élève peut produire une phrase courte pour raconter une partie d’une histoire travaillée en classe en s’appuyant
      sur des images et des expressions toutes faites.
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.raconter.02
    libelle: 'Nommer, caractériser, dénombrer très simplement des personnes, des objets, des lieux : mobiliser quelques mots
      connus en lien avec les domaines étudiés (l’école, la famille, etc.) avoir recours à quelques adjectifs usuels compter
      en utilisant la suite numérique'
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.raconter.03
    libelle: Situer dans l’espace, à l’aide de prépositions et d'expressions lexicalisées, les personnes, les objets et les
      lieux.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.raconter.04
    libelle: 'Situer dans le temps : exprimer le jour ; exprimer des repères temporels très simples.'
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
- id: anglais.cp.se-decrire
  domaine: 'Expression orale en continu : parler en continu'
  theme: Se décrire en utilisant des expressions courtes ou proches des modèles rencontrés lors des apprentissages
  code: EOC-CP
  attendus:
  - id: anglais.cp.se-decrire.01
    libelle: l’élève peut se présenter de manière succincte avec des mots et des expressions toutes faites, en étant soutenu
      et en ayant préparé son propos ;
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.se-decrire.02
    libelle: il peut exprimer ses gouts de façon très succincte.
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.se-decrire.03
    libelle: 'Exprimer simplement des informations sur soi et sur les autres : utiliser le présent des verbes les plus courants
      à la première ou deuxième personne du singulier ; se présenter à l’aide d’expressions lexicalisées.'
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.se-decrire.04
    libelle: 'Donner des informations simples sur des activités quotidiennes, des habitudes : nommer les moments de la journée
      ; mobiliser quelques mots en lien avec les activités quotidiennes, les habitudes, etc.'
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
- id: anglais.cp.echanger-informations
  domaine: 'Expression orale en interaction : réagir et dialoguer'
  theme: Échanger des informations simples
  code: EOI-CP
  attendus:
  - id: anglais.cp.echanger-informations.01
    libelle: l’élève peut saluer un interlocuteur et se présenter à lui ;
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.echanger-informations.02
    libelle: il peut comprendre et utiliser des expressions courantes ;
    qcm: true
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.echanger-informations.03
    libelle: il peut comprendre et utiliser des nombres simples dans les conversations courantes ;
    qcm: true
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.echanger-informations.04
    libelle: il peut poser des questions très simples pour obtenir des informations et comprendre un ou deux mots de la réponse
      ;
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.echanger-informations.05
    libelle: la communication inclut les répétitions nécessaires, un débit lent et des reformulations de la part de l’interlocuteur.
      L’interlocuteur aide l’élève à formuler ce qu’il essaie de dire.
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.echanger-informations.06
    libelle: Poser quelques questions simples à l’aide des pronoms interrogatifs.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.echanger-informations.07
    libelle: Donner quelques consignes ou ordres simples ritualisés à l’aide de verbes fréquemment utilisés à l’impératif.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.echanger-informations.08
    libelle: Utiliser les réponses courtes.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
- id: anglais.cp.emotions-souhaits
  domaine: 'Expression orale en interaction : réagir et dialoguer'
  theme: Exprimer des émotions et formuler des souhaits élémentaires
  code: EOI-CP
  attendus:
  - id: anglais.cp.emotions-souhaits.01
    libelle: l’élève peut formuler des souhaits élémentaires ;
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.emotions-souhaits.02
    libelle: il peut exprimer ses émotions en utilisant le langage corporel (gestes, expressions du visage, etc.) et quelques
      adjectifs simples.
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.emotions-souhaits.03
    libelle: Exprimer son ressenti et ses souhaits de manière très simple en utilisant une gestuelle ou des expressions du
      visage.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.emotions-souhaits.04
    libelle: Exprimer des sentiments ou des émotions dans le cadre de situations ritualisées en utilisant des mots isolés
      ou des expressions très simples.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
- id: anglais.cp.clarifier
  domaine: 'Expression orale en interaction : réagir et dialoguer'
  theme: Clarifier ou faire clarifier un point
  code: EOI-CP
  attendus:
  - id: anglais.cp.clarifier.01
    libelle: L’élève peut signifier son incompréhension, notamment par des gestes.
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.clarifier.02
    libelle: Indiquer très simplement à un interlocuteur que l’on n’a pas compris en utilisant au besoin une gestuelle ou
      des expressions du visage.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.clarifier.03
    libelle: Connaitre et prononcer de manière compréhensible quelques lettres de l’alphabet pour épeler un mot très simple
      ou le reconnaitre (prononciation des lettres d’un prénom, par exemple).
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
- id: anglais.cp.conversation
  domaine: 'Expression orale en interaction : réagir et dialoguer'
  theme: Utiliser des procédés très simples pour commencer, poursuivre et terminer une conversation brève
  code: EOI-CP
  attendus:
  - id: anglais.cp.conversation.01
    libelle: l’élève peut reconnaitre de simples salutations et quelques formules de politesse ;
    qcm: true
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.conversation.02
    libelle: il peut saluer ou remercier.
    qcm: true
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.conversation.03
    libelle: Utiliser des formules de salutation très simples et adaptées à son interlocuteur, en situation connue et répétée,
      pour ouvrir ou clore un échange.
    qcm: true
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.conversation.04
    libelle: Utiliser des formules de politesse variées.
    qcm: true
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.conversation.05
    libelle: Relancer une conversation ou un bref échange par des questions élémentaires.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.conversation.06
    libelle: Utiliser des expressions très courantes pour clore une conversation.
    qcm: true
    colonne: objectifs
    niveau_cecrl: pré-A1
- id: anglais.cp.reperes-culturels
  domaine: Médiation
  theme: Identifier les repères culturels
  code: M-CP
  attendus:
  - id: anglais.cp.reperes-culturels.01
    libelle: l’élève peut indiquer avec des gestes simples les besoins élémentaires d’une tierce personne dans une situation
      précise ;
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.reperes-culturels.02
    libelle: il peut pointer des informations simples et prévisibles d’un intérêt immédiat, figurant sur des supports visuels
      explicites (documents iconographiques, pictogrammes, panneaux et affiches).
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.reperes-culturels.03
    libelle: Mobiliser le champ lexical des besoins élémentaires à l’aide de mots isolés, si nécessaire accompagnés de gestes.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.reperes-culturels.04
    libelle: Utiliser quelques expressions indiquant ce que l’on veut montrer à l’aide de gestes.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
- id: anglais.cp.animer-cooperer
  domaine: Médiation
  theme: Animer un travail collectif, coopérer et contribuer à des échanges interculturels
  code: M-CP
  attendus:
  - id: anglais.cp.animer-cooperer.01
    libelle: l’élève peut demander aux participants une contribution à des tâches élémentaires, notamment par des mots simples
      soutenus par une gestuelle explicitant la tâche à accomplir ;
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.animer-cooperer.02
    libelle: il peut signifier, notamment par des gestes, qu’il a compris ou qu’il est d’accord ;
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.animer-cooperer.03
    libelle: il peut demander aux autres, notamment par des gestes, s’ils ont compris ou s’ils sont d’accord.
    qcm: false
    colonne: attendus
    niveau_cecrl: pré-A1
  - id: anglais.cp.animer-cooperer.04
    libelle: Utiliser des consignes élémentaires accompagnées de gestes.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.animer-cooperer.05
    libelle: Exprimer sa compréhension ou son accord par des expressions simples accompagnées de gestes.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
  - id: anglais.cp.animer-cooperer.06
    libelle: Utiliser des expressions simples accompagnées de gestes pour demander à des personnes si elles sont d’accord.
    qcm: false
    colonne: objectifs
    niveau_cecrl: pré-A1
