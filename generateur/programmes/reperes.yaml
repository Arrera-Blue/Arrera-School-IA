# Repères de niveau (évolution E2.6) : des notions qui n'apparaissent qu'à partir d'une classe donnée, dans les
# programmes officiels. Un exercice d'une classe plus basse qui en contient une reçoit un AVERTISSEMENT (« à
# relire »), jamais un rejet : une notion peut être citée sans être travaillée.
#
# Choisies pour ne pas se déclencher à tort : chaque motif a été cherché dans le programme du cycle 3 (BO n° 16 du
# 17 avril 2025), où il n'apparaît pas — « distributivité » et « losange » y apparaissent, d'où leur absence ici.
# Motifs : expressions régulières, sur le texte en minuscules et sans accents.
# source : l'attendu du référentiel où la notion apparaît, ou, pour la 4e et la 3e (hors référentiel), le
# libellé du programme du cycle 4 (BO n° 10 du 5 mars 2026).

