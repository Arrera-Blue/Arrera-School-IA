fournisseurs:
  ordre: [llamacpp]               # défaut : le modèle en local, aucun tiers ; llama.cpp + Metal sur le Mac depuis le 10/10
  ollama:
    modele: "gemma4:e4b-it-qat"
    url: "http://127.0.0.1:11434" # le conteneur est en --network=host : 127.0.0.1 est l'hôte
    delai_max: 600                # secondes — 4 vCPU sans GPU ; mesuré : 231 s (ancien prompt), 381 s (prompt du 29/09)
    num_ctx: 8192                 # INDISPENSABLE : schéma + exemple dépassent les 4096 par défaut
    think: false                  # Qwen 3 : le mode « raisonnement » coûte des minutes pour rien ici
  llamacpp:                       # le modèle dans le processus Python (docs/etapes/migration-llamacpp.md)
    modele: "modeles/gemma-4-E4B_q4_0-it.gguf"   # relatif à la racine du dépôt (/app) ; le même Gemma 4 E4B QAT qu'Ollama
    n_ctx: 6144                   # prompt ~3 300 tokens + réponse 800 à 2 000 ; chaque token de contexte coûte de la mémoire
    n_threads: 8                  # les 8 cœurs performance du M4 Pro (le calcul lui-même passe par Metal)
    # état du modèle après lecture du prompt, réutilisé d'une génération à l'autre ; DÉSACTIVÉ le 08/10 :
    # chaque sauvegarde recopie trois fois l'état du modèle en mémoire, et le VPS a débordé sur le swap.
    # À réactiver ("cache/llamacpp") une fois la vitesse brute mesurée, en surveillant la mémoire.
    cache: null
    cache_max_go: 2
    verbose: false                # true : les journaux de llama.cpp, dont ses mesures de vitesse, sur la sortie d'erreur
    options:                      # autres réglages de llama_cpp.Llama
      n_gpu_layers: -1            # toutes les couches sur le GPU (Metal) ; sans cette ligne, llama.cpp reste sur le processeur
      flash_attn: true           # Gemma 4 : sans elle, llama.cpp agrandit le cache des couches à 1024 (« padding V cache »)
      n_batch: 512                # lots de lecture du prompt ; 256 économisait 0,25 Go mais lisait ~20 % moins vite
      # type_k: 8                 # cache d'attention compressé en q8_0 (8 = GGML_TYPE_Q8_0) : moitié moins de mémoire,
      # type_v: 8                 #   mais plus lent sur processeur ; désactivé le 08/10 (essai 2), la mémoire suffit
generation:
  tentatives_max: 3               # appels au modèle : la génération, puis 2 reprises des seules questions refusées
  temperature: 0.5
  habillage_min: 2                # générateur procédural : le modèle réécrit les énoncés s'il y en a au moins 2 à réécrire (≈ 60 s par appel)
interface:                        # phase 3 : python -m generateur.interface.api → http://127.0.0.1:8000
  port: 8000                      # l'adresse est toujours 127.0.0.1, sans réglage possible ; connexion obligatoire (E1)
  analyse_par_modele: true        # le modèle complète l'analyse d'une phrase quand les règles n'ont pas trouvé la matière ou la notion
  file_max: 5                     # générations en attente au plus
  decharger_apres_min: 10         # libérer le modèle (~6 Go) après 10 min sans génération ; 0 = le garder chargé
chemins:                          # relatifs à la racine du dépôt (/app dans le conteneur)
  types: "generateur/types"
  sortie: "sortie"
  banque: "banque/instances"
  rejets: "banque/rejets"         # générations rejetées par N1 → N4 : elles comptent dans les mesures
  supprimes: "banque/supprimes"   # exercices supprimés depuis l'interface : récupérables à la main
  base: "donnees/arrera.sqlite3"  # comptes, sessions, journal des accès (E1) ; jamais versionnée ; droits 600, dossier 700
  sauvegardes: "donnees/sauvegardes"  # une copie de la base par jour, gardée 7 jours, droits 600
  cle_codes: "donnees/cle-codes"  # clé secrète des codes des élèves (E3, ⚖3) : hors de la base et des sauvegardes, 600
  lecture: "cache/lecture"        # les morceaux de voix déjà fabriqués (E5) : un aperçu refait ne refait pas la voix
lecture:                          # E5 : la voix des exercices, fabriquée ici par Piper et rangée dans la page (MP3)
  voix: "modeles/piper/fr_FR-siwis-medium.onnx"  # femme, licence CC BY 4.0 ; vide : la voix du navigateur
  # voix: "modeles/piper/fr_FR-upmc-medium.onnx" # l'autre voix retenue : Pierre (homme, CC BY-SA 4.0), avec
  locuteur: null                  #   locuteur: "pierre" (cette voix en a deux : jessica, pierre)
  lenteur: 1.1                    # 1 : le débit de la voix ; 1,1 : un peu plus lent, pour des élèves de collège
suivi:                            # E4 : les règles des indicateurs, affichées telles quelles à l'enseignant
  questions_min: 6                # en dessous : « pas assez de réponses »
  a_consolider: 0.5               # réussite en dessous : « à consolider »
  en_reussite: 0.85               # réussite à partir de : « en réussite »
rgpd:
  aipd_validee: false             # tant que false : « élèves fictifs uniquement » affiché (docs/rgpd/) ; à passer à
                                  # true seulement après la validation du DPO et du chef d'établissement
